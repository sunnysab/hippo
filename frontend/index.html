<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hippo</title>
    <link rel="icon" href="/favicon.ico">
    <script>
      // Apply the stored theme before the first paint so switching never flashes.
      (function () {
        try {
          var mode = localStorage.getItem('hippo-theme');
          if (mode === 'dark' || mode === 'light') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (error) {
          /* storage unavailable: keep following the system preference */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
